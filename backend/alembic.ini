
# Alembic configuration for TeleForward.

[alembic]
# Migration scripts directory, relative to this configuration file.
script_location = migrations

# Add the backend directory to Python's import path.
prepend_sys_path = .

# Use OS-native path separators.
path_separator = os

# Migration file naming convention.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Do not hardcode database credentials here.
# The migration environment loads the URL from application settings.
sqlalchemy.url =

# Timezone used for migration file timestamps.
timezone = UTC

# Maximum length of the generated migration slug.
truncate_slug_length = 60

# Set to true to include type comparison during autogeneration.
compare_type = true

# Include server default comparison during autogeneration.
compare_server_default = true


[post_write_hooks]
# No post-write hooks are required initially.


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
